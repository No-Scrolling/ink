[package]
name = "ink-audio-startup"
version = "0.1.0"
edition = "2024"
publish = false

# Keep this disposable experiment and its codec dependencies out of Ink's engine.
[workspace]

[[bin]]
name = "ink-audio-startup"
path = "main.rs"

[dependencies]
symphonia = { version = "=0.5.5", default-features = false, features = ["mp3"] }

[profile.release]
lto = "thin"
