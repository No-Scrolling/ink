[package]
name = "ink-cli"
version = "0.1.0-alpha.15"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "ink"
path = "src/main.rs"

[dependencies]
ab_glyph.workspace = true
anyhow = { workspace = true, features = ["std"] }
base64 = "0.22.1"
clap.workspace = true
crossterm = "0.29"
image.workspace = true
indicatif.workspace = true
ink-compiler = { path = "../ink-compiler" }
ink-core = { path = "../ink-core", features = ["design-fonts"] }
ink-renderer-vulkan = { path = "../ink-renderer-vulkan", features = ["offscreen"] }
ink-runtime = { path = "../ink-runtime" }
owo-colors.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
roxmltree = "0.20"
toml.workspace = true
semver = "1.0"
zip = { version = "9.4", default-features = false, features = ["deflate"] }
