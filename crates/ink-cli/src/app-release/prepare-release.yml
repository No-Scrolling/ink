name: Prepare Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version, for example 0.2.0'
        required: true
        type: string
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: prepare-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - name: Bump the app version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: bun .github/ink-release.mjs prepare
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: release/v${{ inputs.version }}
          title: 'release: v${{ inputs.version }}'
          commit-message: 'release: v${{ inputs.version }}'
          body: 'Release v${{ inputs.version }}. Merging this PR builds and publishes the signed APK.'
          add-paths: ink.toml
