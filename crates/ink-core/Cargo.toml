[package]
name = "ink-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["ui-lists", "ui-playing", "ui-messages", "ui-views", "ui-canvas", "text-input", "camera", "video", "maps"]
ui-lists = []
ui-playing = []
ui-messages = []
ui-views = ["ui-canvas", "text-input", "camera", "video", "maps"]
ui-canvas = []
text-input = []
camera = []
video = []
maps = []
perf = []
design-fonts = []

[dependencies]
arabic_reshaper = "0.4.2"
unicode-bidi = "0.3.18"
ahash = "0.8.12"
rustc-hash = "2.1.3"
ink-protocol = { path = "../ink-protocol" }
ab_glyph.workspace = true
serde_json.workspace = true
serde.workspace = true
anyhow.workspace = true
unicode-linebreak.workspace = true
unicode-segmentation.workspace = true
unicode-properties.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
memmap2 = "0.9.11"
