[package]
name = "ink-renderer-vulkan"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ab_glyph.workspace = true
anyhow.workspace = true
bytemuck.workspace = true
ink-core = { path = "../ink-core", default-features = false }
miniz_oxide.workspace = true
unicode-segmentation.workspace = true
ash = { version = "0.38.0", default-features = false, features = ["loaded", "std", "debug"] }

[build-dependencies]
naga = { version = "30.0.1", features = ["spv-out", "wgsl-in"] }

[features]
image = []
perf = ["ink-core/perf"]
presentation-timing = ["perf"]
