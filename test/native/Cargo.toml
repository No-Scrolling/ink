[package]
name = "ink-test"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ink-runtime = { path = "../../crates/ink-runtime" }
ink-core = { path = "../../crates/ink-core", features = ["perf"] }
ink-protocol = { path = "../../crates/ink-protocol" }
serde_json.workspace = true
anyhow.workspace = true
ink-data = { path = "../../crates/ink-data", features = ["store", "crypto"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
ink-audio = { path = "../../crates/ink-audio" }
ink-renderer-vulkan = { path = "../../crates/ink-renderer-vulkan", features = ["offscreen", "perf"] }
image.workspace = true
miniz_oxide.workspace = true

[[bin]]
name = "ink-performance"
path = "../performance/main.rs"

[[bin]]
name = "ink-render-performance"
path = "../performance/render.rs"

[[bin]]
name = "ink-source-performance"
path = "../performance/source.rs"

[[bin]]
name = "ink-automatic-performance"
path = "../performance/automatic.rs"
